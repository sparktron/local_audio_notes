data_dir = "data"
models_dir = "models"
device = "auto"  # auto, cuda, cpu
whisper_model = "large-v3"  # informational name; weights come from local manifest
language = "en"  # use "auto" for language detection
alignment_language = "en"  # must match detected language; install another model explicitly
batch_size = 8
compute_type = "float16"  # CPU always uses int8
cpu_threads = 8
min_speakers = 1
max_speakers = 8
max_audio_bytes = 2147483648
max_audio_seconds = 28800
max_transcript_bytes = 10485760
audio_window_seconds = 600
chunk_chars = 5000  # max transcript bytes per extraction request (also bounded by context)
chunk_overlap_segments = 2  # segments repeated between chunks; duplicates are consolidated
job_max_attempts = 3  # automatic requeues after a crash/kill before a job is marked failed
oom_cpu_fallback = false  # true: retry diarization on CPU after GPU OOM at batch size 1 (slow)
embedding_model = ""  # optional: exact installed local Ollama embedding model for semantic search
hash_cache = true  # reuse SHA-256 while inode/size/mtime/ctime match; models-check --full rehashes
ollama_url = "http://127.0.0.1:11434"
ollama_model = ""  # REQUIRED: select an installed model via ollama-models
ollama_context = 8192
ollama_predict = 2048
ollama_timeout = 600
offline_enforced = false  # true requires an isolated network namespace with only lo
